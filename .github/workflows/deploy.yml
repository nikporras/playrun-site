name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Playwright tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - name: Hand the results to the build
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: tests/results/run.json
          retention-days: 14

  build:
    name: Build site
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Results of the test job, read by the Quality page
        uses: actions/download-artifact@v4
        with:
          name: playwright-results
          path: tests/results
      - name: The build reads the run from this pipeline, so it must be there
        run: |
          test -s tests/results/run.json || { echo "::error::tests/results/run.json is missing: the Home scoreboard and the Quality page need the test job's run"; exit 1; }
          node -e "const r=require('./tests/results/run.json'); if(!r.stats||!r.suites?.length){console.error('::error::run.json has no run in it'); process.exit(1)}"
      - uses: withastro/action@v3
        with:
          node-version: 24
          package-manager: npm@latest

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    name: Tell IndexNow what changed
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # (a report only: a search engine being down never fails the deploy)
    continue-on-error: true
    steps:
      - name: Post the sitemap's addresses to IndexNow
        run: |
          urls=$(curl -fsS https://playrunqa.com/sitemap-0.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | jq -R . | jq -s -c .) || { echo "Could not read the sitemap"; exit 0; }
          body=$(jq -n --argjson urls "$urls" '{host: "playrunqa.com", key: "ba54fe2b9837ad645217daed2d1f84dd", keyLocation: "https://playrunqa.com/ba54fe2b9837ad645217daed2d1f84dd.txt", urlList: $urls}')
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body") || status=error
          echo "IndexNow answered $status for $(echo "$urls" | jq length) addresses"
