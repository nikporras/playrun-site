name: Weekly live check

# Every Monday at 07:00 UTC, and by hand: the live site, https://playrunqa.com, checked by its own
# small Playwright project (playwright.live.config.ts, tests-live/): every page loads clean under
# its policy, every link answers (a rate limit is a warning), the contact form's script answers its
# health check (never a message), and the files for crawlers are served. Read only, never counted
# as a visit. A failure fails the run, so GitHub sends an email, and the report is kept.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
  # (and whenever the check itself changes on main, so a new check is tried at once)
  push:
    branches: [main]
    paths:
      - .github/workflows/live-check.yml
      - playwright.live.config.ts
      - tests-live/**

permissions:
  contents: read

env:
  NPM_VERSION: 11.12.1

jobs:
  live:
    name: Check the live site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: npm ${{ env.NPM_VERSION }}
        run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check https://playrunqa.com
        run: npx playwright test -c playwright.live.config.ts
        env:
          CI: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-check-report
          path: |
            live-report
            test-results
          retention-days: 30
